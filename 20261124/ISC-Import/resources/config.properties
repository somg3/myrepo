# Local SailPoint ISC load configuration (gitignored).
# Prefer env vars for secrets:
#   EZYMIGRATE_ISC_CLIENT_ID / EZYMIGRATE_ISC_CLIENT_SECRET
#   EZYMIGRATE_ISC_BASE_URL / EZYMIGRATE_ISC_OWNER_ID / EZYMIGRATE_ISC_OWNER_NAME
#------------------------------------------------------------------------------------------------------

#application_under_test_base_url=https://YOUR_TENANT.api.identitynow.com
#identity_client_id=YOUR_CLIENT_ID
#client_secret=YOUR_CLIENT_SECRET
#identity_admin_id=YOUR_OWNER_IDENTITY_ID
#identity_admin_user=YOUR_OWNER_NAME

application_under_test_base_url=https://devrel-ga-21129.api.identitynow-demo.com
identity_admin_user=shalaka
identity_admin_id=03a513f000d249948f82eb7a7acc70f5

identity_client_id=f49a077568e940fb85981a6a1970403f
client_secret=477b6d911f632c3605d2d714260bbf62fc47b5733ef24985b18a317d370fcb53

sailpoint_isc_restapi_file=resources/sailpoint_isc_restapi_path.properties

# Delimited File and SQL Loader files, under delimited_folder_path:
#   account: <source name>.csv
#   group:   <source name>-group.csv
delimited_folder_path=/sandbox/incoming/sqlloader/
# Sample SFTP for Delimited File and SQL Loader only. Applied when sftp_host is set.
# Account and group files both use these settings (host and group.host).
# sftp_auth_method: password (Basic) or publicKey.
# Replace the sample host, user, and password before load.
# Password may also be supplied as EZYMIGRATE_ISC_SFTP_PASSWORD.
sftp_host=
sftp_port=
sftp_user=
sftp_password=
sftp_auth_method=
sftp_private_key_path=
sftp_private_key_passphrase=

# Direct connectors (JDBC) need a Virtual Appliance cluster. Optional when the tenant has exactly one.
Cluster_TYPE=Cluster
Cluster_ID=b19dabc8383a453093f4cb398dc58ade
Cluster_NAME=ezy-m-testing